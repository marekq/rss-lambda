AWSTemplateFormatVersion: '2010-09-09'
Transform: 'AWS::Serverless-2016-10-31'
Description: An AWS Serverless Specification template describing your function.

Parameters:
  SourceEmail:
    Type: String
    Description: The sending email address for notification emails.
    Default: aws@marek.rocks

  DestEmail:
    Type: String
    Description: The receiving email address for notification emails.
    Default: marek.kuczynski@gmail.com

  SendEmails: 
    Description: Set whether to send SES emails or not (default 'n'). 
    Default: 'n'
    Type: String
    AllowedValues: 
      - 'y'
      - 'n'

  CreateAppSync:
    Description: Create a read only AppSync endpoint for the blogs stored in DynamoDB
    Default: 'n'
    Type: String
    AllowedValues:
      - 'y'
      - 'n'

# appsync create condition
Conditions: 
  EnableAppSync: !Equals [ !Ref CreateAppSync, y ]

Resources:

  # create per rss feed retrieval function
  rssgetfeed:
    Type: 'AWS::Serverless::Function'
    Properties:
      Handler: getfeed.handler
      Runtime: python3.14
      CodeUri: s3://aws-sam-cli-managed-default-samclisourcebucket-15fuisfyzox3u/9cfda06849f4b78b8d1486a9e16836db
      Description: 'Retrieve RSS feeds and store them in DynamoDB'
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - 'ses:SendEmail'
              Resource: '*'
        - ComprehendFullAccess
        - DynamoDBCrudPolicy:
            TableName: !Ref rssfeed
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - 'dynamodb:TransactWriteItems'
              Resource: !GetAtt rssfeed.Arn
        - S3CrudPolicy:
            BucketName: !Ref PublicJsonBucket
      MemorySize: 512
      Timeout: 300
      Architectures:
        - arm64
      Environment:
        Variables:
          dynamo_table: !Ref rssfeed
          dynamo_region: !Ref 'AWS::Region'
          s3bucket: !Ref PublicJsonBucket
          fromemail: !Ref SourceEmail
          toemail: !Ref DestEmail
         
      Tracing: Active
      ReservedConcurrentExecutions: 50
      Layers: 
        - !Ref lambdalayer

  # send a concise SES alert when the workflow execution fails
  statefailurealert:
    Type: 'AWS::Serverless::Function'
    Properties:
      Handler: alert.handler
      Runtime: python3.14
      CodeUri: s3://aws-sam-cli-managed-default-samclisourcebucket-15fuisfyzox3u/d54d8decee9e4702d910561b08940b92
      Description: 'Send an SES alert when the RSS state machine execution fails'
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - 'ses:SendEmail'
              Resource: '*'
      MemorySize: 128
      Timeout: 10
      Architectures:
        - arm64
      Environment:
        Variables:
          fromemail: !Ref SourceEmail
          toemail: !Ref DestEmail

  # create rss feed crawl function
  rsscrawl:
    Type: 'AWS::Serverless::Function'
    Properties:
      Handler: crawl.handler
      Runtime: python3.14
      CodeUri: s3://aws-sam-cli-managed-default-samclisourcebucket-15fuisfyzox3u/abe37950b4320832a74f211346efeb9c
      Description: 'Retrieve RSS feeds and check files stored on S3'
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref rssfeed
        - S3ReadPolicy:
            BucketName: !Ref PublicJsonBucket
      MemorySize: 256
      Timeout: 30
      Architectures:
        - arm64
      Environment:
        Variables:
          dynamo_region: !Ref 'AWS::Region'
          dynamo_table: !Ref rssfeed
          s3bucket: !Ref PublicJsonBucket
          sendemails: !Ref SendEmails
      Tracing: Active
      ReservedConcurrentExecutions: 1
      Layers: 
        - !Ref lambdalayer

  # refresh pagecount stored in dynamodb using a manual lambda invoke
  pagecount:
    Type: 'AWS::Serverless::Function'
    Properties:
      Handler: pagecount.handler
      Runtime: python3.14
      CodeUri: s3://aws-sam-cli-managed-default-samclisourcebucket-15fuisfyzox3u/44b15f7ef503d2c7a0fea09903216e8e
      Description: 'Retrieve the total article count for blogs stored in DynamoDB'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref rssfeed
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          dynamo_region: !Ref 'AWS::Region'
          dynamo_table: !Ref rssfeed
      Tracing: Active
      ReservedConcurrentExecutions: 1

  # create lambda layer with dependencies
  lambdalayer:
    Type: AWS::Serverless::LayerVersion
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LayerName: rsslayer
      Description: Python 3.14 dependencies for BeautifulSoup4, readability-lxml, feedparser, and requests
      ContentUri: s3://aws-sam-cli-managed-default-samclisourcebucket-15fuisfyzox3u/0d4c3e43d22328298399a16bbd455430
      CompatibleRuntimes:
        - python3.14
      CompatibleArchitectures:
        - arm64
      LicenseInfo: 'MIT-0'
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.14
      BuildArchitecture: arm64

  # dynamodb table for blog articles
  rssfeed:
    Type: 'AWS::DynamoDB::Table'
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      AttributeDefinitions:
      - AttributeName: guid
        AttributeType: S
      - AttributeName: timest
        AttributeType: N
      - AttributeName: visible
        AttributeType: S
      - AttributeName: blogsource
        AttributeType: S
      - AttributeName: provider
        AttributeType: S
      KeySchema:
      - AttributeName: guid
        KeyType: HASH
      - AttributeName: timest
        KeyType: RANGE  
      GlobalSecondaryIndexes:
      - IndexName: visible
        KeySchema:
        - AttributeName: visible
          KeyType: HASH
        - AttributeName: timest
          KeyType: RANGE
        Projection:
          ProjectionType: ALL
      - IndexName: timest
        KeySchema:
        - AttributeName: blogsource
          KeyType: HASH
        - AttributeName: timest
          KeyType: RANGE
        Projection:
          ProjectionType: ALL
      - IndexName: feed-source-timest
        KeySchema:
        - AttributeName: blogsource
          KeyType: HASH
        - AttributeName: timest
          KeyType: RANGE
        Projection:
          ProjectionType: INCLUDE
          NonKeyAttributes: [visible, link, preview, title, author]
      - IndexName: feed-visible-timest
        KeySchema:
        - AttributeName: visible
          KeyType: HASH
        - AttributeName: timest
          KeyType: RANGE
        Projection:
          ProjectionType: INCLUDE
          NonKeyAttributes: [link, blogsource, preview, title, author]
      - IndexName: provider-timest
        KeySchema:
        - AttributeName: provider
          KeyType: HASH
        - AttributeName: timest
          KeyType: RANGE
        Projection:
          ProjectionType: INCLUDE
          NonKeyAttributes: [visible, link, blogsource, preview, title, author]
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  # log group
  rssblog:
    Type: AWS::Logs::LogGroup

  # public s3 bucket
  PublicJsonBucket:
    Type: AWS::S3::Bucket

  # state machine to coordinate the workflow
  blogstatemachine:
    Type: AWS::Serverless::StateMachine
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Type: STANDARD
      Tracing:
        Enabled: false
      DefinitionUri: s3://aws-sam-cli-managed-default-samclisourcebucket-15fuisfyzox3u/6f195a922f45232c4d96e3ee856de6d3
      DefinitionSubstitutions:
        rsscrawl: !GetAtt rsscrawl.Arn
        rssgetfeed: !GetAtt rssgetfeed.Arn
      Policies: 
        - LambdaInvokePolicy:
            FunctionName: !Ref rsscrawl
        - LambdaInvokePolicy:
            FunctionName: !Ref rssgetfeed
        - CloudWatchFullAccess
      Logging:
        Level: ERROR
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/vendedlogs/states/rssblog:*'
      Events:
        ScheduledEventWeekdays:
          Type: ScheduleV2
          Properties:
            Description: 'Run the RSS workflow every three hours on weekdays during the day'
            Name: !Sub '${AWS::StackName}-rss-weekday-schedule'
            ScheduleExpression: 'cron(0 9,12,15,18,21 ? * MON-FRI *)'
            ScheduleExpressionTimezone: Europe/Amsterdam
            FlexibleTimeWindow:
              Mode: 'OFF'
        ScheduledEventWeekends:
          Type: ScheduleV2
          Properties:
            Description: 'Run the RSS workflow once at 09:00 on weekends'
            Name: !Sub '${AWS::StackName}-rss-weekend-schedule'
            ScheduleExpression: 'cron(0 9 ? * SAT,SUN *)'
            ScheduleExpressionTimezone: Europe/Amsterdam
            FlexibleTimeWindow:
              Mode: 'OFF'

  # alert only failed, timed-out, or aborted executions of this state machine
  statefailurealertrule:
    Type: 'AWS::Events::Rule'
    Properties:
      Description: 'Send an SES alert for failed RSS workflow executions'
      EventPattern:
        source:
          - aws.states
        detail-type:
          - Step Functions Execution Status Change
        detail:
          stateMachineArn:
            - !Ref blogstatemachine
          status:
            - FAILED
            - TIMED_OUT
            - ABORTED
      State: ENABLED
      Targets:
        - Arn: !GetAtt statefailurealert.Arn
          Id: StateMachineFailureAlert

  statefailurealertpermission:
    Type: 'AWS::Lambda::Permission'
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt statefailurealert.Arn
      Principal: events.amazonaws.com
      SourceArn: !GetAtt statefailurealertrule.Arn

  # graphql api role
  GraphQLApiRole:
    Condition: EnableAppSync 
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: 'appsync.amazonaws.com'
          Action: 'sts:AssumeRole'
      Policies:
      - PolicyName: CWLogs
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - 'logs:CreateLogGroup'
            - 'logs:CreateLogStream'
            - 'logs:PutLogEvents'
            Resource: '*'
      - PolicyName: DDBRead   
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - 'dynamodb:GetItem'
            - 'dynamodb:Query'
            - 'dynamodb:Scan'
            Resource:
            - !GetAtt rssfeed.Arn
            - !Sub '${rssfeed.Arn}/*'

  # create graphql api
  GraphQLApi:
    Condition: EnableAppSync 
    Type: 'AWS::AppSync::GraphQLApi'
    Properties:
      XrayEnabled: true
      Name: !Ref 'AWS::StackName'
      AuthenticationType: API_KEY
      LogConfig:
        CloudWatchLogsRoleArn: !GetAtt 'GraphQLApiRole.Arn'
        FieldLogLevel: ALL

  # define graphql schema
  GraphQLSchema:
    Condition: EnableAppSync 
    Type: 'AWS::AppSync::GraphQLSchema'
    Properties:
      Definition: |
        schema { query: Query }

        type Query {
          QueryDdbByBlogsourceAndTimest(blogsource: String!, filter: TableddbsourceFilterInput, limit: Int, nextToken: String, timest: Int!): listourceConnection
          QueryDdbByVisibleAndTimest(blogsource: String!, filter: TableddbsourceFilterInput, limit: Int, nextToken: String, timest: Int!, visible: String!): listourceConnection
          QueryDdbGetDetailText(guid: String!, timest: Int): itemsourceConnection
          QueryDdbItemCountPerBlog(blogsource: String!): pagecountConnection
          QueryDdbItemCountAll(timest: Int!): pagecountConnection
          blogsByProvider(limit: Int, nextToken: String, provider: BlogProvider!, timest: Int!): listourceConnection
        }

        type itemsource { author: String blogsource: String description: String guid: String link: String rawhtml: String @deprecated(reason : "Stored HTML is no longer returned. Use description for a plain-text preview.") timest: Int }
        type itemsourceConnection { items: [itemsource] }
        type listsource { author: String blogsource: String description: String guid: String link: String timest: Int title: String }
        type listourceConnection { items: [listsource] nextToken: String }
        type pagecount { articlecount: Int blogsource: String timest: Int visible: String }
        type pagecountConnection { items: [pagecount] }
        enum BlogProvider { aws gcp wiz }
        input TableIntFilterInput { between: [Int] contains: Int eq: Int ge: Int gt: Int le: Int lt: Int ne: Int notContains: Int }
        input TableStringFilterInput { beginsWith: String between: [String] contains: String eq: String ge: String gt: String le: String lt: String ne: String notContains: String }
        input TableddbsourceFilterInput { blogsource: TableStringFilterInput guid: TableStringFilterInput timest: TableIntFilterInput visible: TableStringFilterInput }
      ApiId: !GetAtt 'GraphQLApi.ApiId'

  # define dynamodb source
  DDBDataSource:
    Condition: EnableAppSync 
    Type: 'AWS::AppSync::DataSource'
    Properties:
      Type: AMAZON_DYNAMODB
      ServiceRoleArn: !GetAtt 'GraphQLApiRole.Arn'
      ApiId: !GetAtt 'GraphQLApi.ApiId'
      Name: ddbsourcce
      DynamoDBConfig:
        TableName: !Ref rssfeed
        AwsRegion: !Ref 'AWS::Region'

  # create appsync api key
  ApiKey:
    Condition: EnableAppSync
    Type: 'AWS::AppSync::ApiKey'
    Properties:
      ApiId: !GetAtt 'GraphQLApi.ApiId'

  # create per blogsource resolver for appsync
  BlogSourceResolver:
    Condition: EnableAppSync 
    Type: 'AWS::AppSync::Resolver'
    Properties:
      TypeName: Query
      DataSourceName: !GetAtt 'DDBDataSource.Name'
      RequestMappingTemplate: |
        #if(!$util.isNull($ctx.args.filter.blogsource) || !$util.isNull($ctx.args.filter.timest))
          $util.error("Use blogsource and timest query arguments for index key conditions", "BadRequest")
        #end
        #set($filter = {"expression": "#published = :published", "expressionNames": {"#published": "visible"}, "expressionValues": {":published": {"S": "y"}}})
        #set($limit = $util.defaultIfNull($ctx.args.limit, 100))
        #if($limit < 1 || $limit > 101)
          $util.error("limit must be between 1 and 101", "BadRequest")
        #end
        {
          "version": "2018-05-29",
          "operation": "Query",
          "index": "feed-source-timest",
          "limit": $limit,
          "scanIndexForward": false,
          "select": "ALL_PROJECTED_ATTRIBUTES",
          "query": { "expression": "#provider = :provider AND #timest > :timest", "expressionNames": { "#provider": "blogsource", "#timest": "timest" }, "expressionValues": { ":provider": $util.dynamodb.toDynamoDBJson($ctx.args.blogsource), ":timest": $util.dynamodb.toDynamoDBJson($ctx.args.timest) } },
          "filter": $util.toJson($filter),
          "nextToken": $util.toJson($util.defaultIfNull($ctx.args.nextToken, null))
        }
      ResponseMappingTemplate: |
        $util.toJson($context.result)
      ApiId: !GetAtt 'GraphQLApi.ApiId'
      FieldName: QueryDdbByBlogsourceAndTimest

  # create visible blogs resolver for appsync
  VisibleResolver:
    Condition: EnableAppSync 
    Type: 'AWS::AppSync::Resolver'
    Properties:
      TypeName: Query
      DataSourceName: !GetAtt 'DDBDataSource.Name'
      RequestMappingTemplate: |
        {
          "version" : "2017-02-28",
          "operation" : "Query",
          "index" : "visible",
          "limit" : 25,
          "scanIndexForward" : false,
          "select" : "ALL_PROJECTED_ATTRIBUTES",
          "query" : {
            "expression" : "visible = :visible and timest > :timest",
            "expressionValues" : {
              ":visible" : { "S" : "$context.arguments.visible" },
              ":timest" : { "N": $context.arguments.timest }
            }
          },
          "nextToken": #if( $context.args.nextToken ) "$context.args.nextToken" #else null #end
        }
      ResponseMappingTemplate: |
        $util.toJson($context.result)
      ApiId: !GetAtt 'GraphQLApi.ApiId'
      FieldName: QueryDdbByVisibleAndTimest

  # create single article resolver for appsync
  SingleBlogResolver:
    Condition: EnableAppSync 
    Type: 'AWS::AppSync::Resolver'
    Properties:
      TypeName: Query
      DataSourceName: !GetAtt 'DDBDataSource.Name'
      RequestMappingTemplate: |
        {
          "version" : "2017-02-28",
          "operation" : "Query",
          "query" : {
            "expression" : "guid = :guid",
            "expressionValues" : {
              ":guid" : {"S": "$context.arguments.guid"}
            }
          }
        }
      ResponseMappingTemplate: |
        $util.toJson($context.result)
      ApiId: !GetAtt 'GraphQLApi.ApiId'
      FieldName: QueryDdbGetDetailText

  # create page count resolver per blog for appsync
  PerBlogPageCountResolver:
    Condition: EnableAppSync 
    Type: 'AWS::AppSync::Resolver'
    Properties:
      TypeName: Query
      DataSourceName: !GetAtt 'DDBDataSource.Name'
      RequestMappingTemplate: |
        {
          "version" : "2017-02-28",
          "operation" : "Query",
          "index" : "timest",
          "select" : "ALL_PROJECTED_ATTRIBUTES",
          "query" : {
            "expression" : "blogsource = :bs and timest = :ts",
            "expressionValues" : {
              ":bs" : { "S" : "$context.arguments.blogsource" },
              ":ts" : { "N" : 0 }
            }
          }
        }
      ResponseMappingTemplate: |
        $util.toJson($context.result)
      ApiId: !GetAtt 'GraphQLApi.ApiId'
      FieldName: QueryDdbItemCountPerBlog

  # create page count resolver for all blogs appsync
  AllBlogsPageCountResolver:
    Condition: EnableAppSync 
    Type: 'AWS::AppSync::Resolver'
    Properties:
      TypeName: Query
      DataSourceName: !GetAtt 'DDBDataSource.Name'
      RequestMappingTemplate: |
        {
          "version" : "2017-02-28",
          "operation" : "Query",
          "index" : "visible",
          "select" : "ALL_PROJECTED_ATTRIBUTES",
          "query" : {
            "expression" : "visible = :visible and timest = :ts",
            "expressionValues" : {
              ":visible" : { "S" : "y" },
              ":ts" : { "N" : 0 }
            }
          }
        }
      ResponseMappingTemplate: |
        $util.toJson($context.result)
      ApiId: !GetAtt 'GraphQLApi.ApiId'
      FieldName: QueryDdbItemCountAll

  ProviderResolver:
    Condition: EnableAppSync
    Type: 'AWS::AppSync::Resolver'
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TypeName: Query
      DataSourceName: !GetAtt 'DDBDataSource.Name'
      RequestMappingTemplate: |
        #set($filter = {"expression": "#published = :published", "expressionNames": {"#published": "visible"}, "expressionValues": {":published": {"S": "y"}}})
        #set($limit = $util.defaultIfNull($ctx.args.limit, 100))
        #if($limit < 1 || $limit > 101)
          $util.error("limit must be between 1 and 101", "BadRequest")
        #end
        {
          "version": "2018-05-29",
          "operation": "Query",
          "index": "provider-timest",
          "limit": $limit,
          "scanIndexForward": false,
          "select": "ALL_PROJECTED_ATTRIBUTES",
          "query": { "expression": "#provider = :provider AND #timest > :timest", "expressionNames": { "#provider": "provider", "#timest": "timest" }, "expressionValues": { ":provider": $util.dynamodb.toDynamoDBJson($ctx.args.provider), ":timest": $util.dynamodb.toDynamoDBJson($ctx.args.timest) } },
          "filter": $util.toJson($filter),
          "nextToken": $util.toJson($util.defaultIfNull($ctx.args.nextToken, null))
        }
      ResponseMappingTemplate: |
        #if($ctx.error)
          $util.error($ctx.error.message, $ctx.error.type)
        #end
        #foreach($item in $ctx.result.items)
          $util.qr($item.put("description", $util.defaultIfNull($item.preview, "")))
        #end
        $util.toJson($ctx.result)
      ApiId: !GetAtt 'GraphQLApi.ApiId'
      FieldName: blogsByProvider

# print the url of the state machine and graphql details
Outputs:
  StateMachineURL:
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/states/home?region=${AWS::Region}#/statemachines/view/${blogstatemachine}'
